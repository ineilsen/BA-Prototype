<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manage your disruption — British Airways</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%231D2757'/><text x='16' y='22' text-anchor='middle' fill='white' font-size='16' font-weight='bold' font-family='sans-serif'>BA</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
:root{
  --navy:#1D2757; --blue:#1D5CA9; --blue-dk:#17457F; --blue-tint:#EDF3FA;
  --red:#C8102E; --red-tint:#FDF0F2;
  --amber:#8A5200; --amber-bg:#E8A33D; --amber-tint:#FFF6E8;
  --green:#0E7A4E; --green-tint:#EDF9F2;
  --bg:#F7F8FA; --surface:#FFFFFF; --line:#EDF0F5; --line-2:#D5DBE5;
  --ink:#1D2757; --ink-2:#5A6882; --ink-3:#8E99AB;
  --r:20px; --r-s:12px;
  --sp-xs:4px; --sp-s:8px; --sp-m:16px; --sp-l:24px; --sp-xl:32px; --sp-2xl:48px;
  --sh-1:0 2px 8px rgba(29,39,87,.04);
  --sh-2:0 8px 28px rgba(29,39,87,.08);
  --ease-out:cubic-bezier(.2,.7,.3,1);
  --f:"Mulish",-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-m:"IBM Plex Mono",monospace;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16.5px;line-height:1.65;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:left}
a{color:var(--blue)}
:focus-visible{outline:3px solid #7EB2E8;outline-offset:2px;border-radius:4px}
.mono{font-family:var(--f-m);font-variant-numeric:tabular-nums}
svg.lucide{width:1em;height:1em;stroke-width:2;vertical-align:-.125em}
.bi{height:19px;width:auto;max-width:92px;object-fit:contain}
.bi-sm{height:15px}
.wordmark{font-size:12.5px;font-weight:700;color:var(--navy);padding:2px 8px;border:1px solid var(--line-2);border-radius:5px;background:var(--surface);white-space:nowrap;display:inline-block}

/* ═══════════ APP SHELL — ADAPTIVE NAV ═══════════ */
.app-shell{display:none;min-height:100vh;background:var(--bg)}
.app-shell.active{display:grid;grid-template-columns:240px 1fr;grid-template-rows:auto 1fr}
.hub-shell{display:none;grid-column:2;overflow-y:auto}
.hub-shell.active{display:block}
.app-shell.in-hub .app-hdr .app-hdr-r{display:none}
.app-shell.in-hub .app-hdr .hub-hdr-r{display:flex}
.app-shell.in-hub .app-tab-bar{display:none!important}

.app-sidebar{grid-row:1/-1;position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:var(--sp-l) 0 var(--sp-m);overflow-y:auto;z-index:41}
.ba-ribbon{height:22px;width:auto;object-fit:contain}
.ba-wm{font-size:15px;font-weight:800;letter-spacing:.02em;color:var(--navy)}
.app-sidebar .sb-logo{padding:0 var(--sp-l) var(--sp-xl);display:flex;align-items:center;gap:10px}
.app-sidebar .sb-logo .ba-ribbon{height:20px}
.sb-nav{flex:1;display:flex;flex-direction:column;gap:var(--sp-xs);padding:0 var(--sp-s)}
.sb-item{display:flex;align-items:center;gap:12px;padding:10px var(--sp-m);border-radius:var(--r-s);font-size:14.5px;font-weight:600;color:var(--ink-2);transition:background .16s,color .16s;position:relative}
.sb-item svg{width:20px;height:20px;flex-shrink:0}
.sb-item:hover{background:var(--bg);color:var(--ink)}
.sb-item.active{background:var(--blue-tint);color:var(--blue)}
.sb-item .badge{position:absolute;top:6px;left:26px;width:18px;height:18px;border-radius:50%;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;line-height:1}
.sb-foot{padding:var(--sp-m) var(--sp-l) 0;border-top:1px solid var(--line);margin-top:auto;display:flex;align-items:center;gap:10px}
.sb-foot .sb-av{width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;flex-shrink:0}
.sb-foot span{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.app-hdr{background:var(--navy);padding:0 20px;display:none;align-items:center;justify-content:space-between;height:60px;position:sticky;top:0;z-index:40}
.app-hdr .ba-ribbon{height:24px;width:auto;filter:brightness(0) invert(1);opacity:.9}
.app-hdr-r{display:flex;align-items:center;gap:12px}
.app-hdr-r button{color:rgba(255,255,255,.85);display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600}
.app-hdr-r button:hover{color:#fff}
.app-hdr-r svg{width:20px;height:20px}
.app-hdr-av{display:none}
.hub-back-mob{color:#fff;display:none;place-items:center;width:36px;height:36px;border-radius:50%;position:absolute;left:var(--sp-m)}
.hub-back-mob svg{width:22px;height:22px}
.app-shell.in-hub .hub-back-mob{display:grid}
.hub-hdr-r{position:absolute;right:var(--sp-m);display:none;align-items:center;gap:10px}
.hub-hdr-r .chip{padding:4px 11px;border-radius:100px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);font-family:var(--f-m);font-size:12px;color:#fff}

.app-body{overflow-y:auto;padding:0 var(--sp-xl) var(--sp-2xl)}

.app-tab-bar{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--navy);display:none;justify-content:space-around;padding:0 0 env(safe-area-inset-bottom,8px)}
.app-tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 16px 8px;font-size:10px;font-weight:600;color:rgba(255,255,255,.5);text-decoration:none;position:relative;transition:color .16s;border-top:3px solid transparent}
.app-tab svg{width:24px;height:24px;stroke-width:1.6}
.app-tab.active{color:#fff;border-top-color:#fff}
.app-tab .badge{position:absolute;top:4px;right:2px;width:18px;height:18px;border-radius:50%;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;line-height:1}

.trips-greeting{padding:var(--sp-l) 0 var(--sp-m);font-size:clamp(26px,3vw,34px);font-weight:700;color:var(--navy);line-height:1.2}
.trips-greeting .tg-sub{display:block;font-size:15px;font-weight:500;color:var(--ink-3);margin-bottom:4px;letter-spacing:0}
.trips-sub{padding:0 0 var(--sp-l);font-size:15px;color:var(--ink-2)}
.trip-section-hd{margin-bottom:10px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.trips-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--sp-m);max-width:800px}

.trip-card{border-radius:var(--r);background:var(--surface);border:none;box-shadow:var(--sh-2);overflow:hidden;cursor:pointer;transition:box-shadow .35s var(--ease-out),transform .35s var(--ease-out)}
.trip-card:hover{box-shadow:0 12px 36px rgba(29,39,87,.12);transform:translateY(-2px)}
.trip-card-hdr{background:linear-gradient(145deg,var(--navy) 0%,#2A3A72 100%);color:#fff;padding:20px;position:relative}
.trip-card-hdr .tc-ribbon{height:14px;width:auto;opacity:.3;margin-bottom:6px;display:block;mix-blend-mode:lighten;filter:brightness(0) invert(1)}
.trip-card-hdr .tc-flight{font-family:var(--f-m);font-size:12.5px;opacity:.6;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.trip-card-hdr .tc-cabin{font-size:12.5px;opacity:.5;margin-top:8px}
.trip-card-hdr .tc-cabin span+span::before{content:"·";margin:0 8px}
.trip-card-hdr .trip-route{margin-bottom:0}
.trip-card-hdr .trip-route-pt .iata{color:#fff;font-size:36px;letter-spacing:-.02em}
.trip-card-hdr .trip-route-pt .city{color:rgba(255,255,255,.55);font-size:13px}
.trip-card-hdr .trip-route-line{border-top-color:rgba(255,255,255,.2)}
.trip-card-hdr .trip-route-line::after{border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.08)}
.trip-card-hdr .trip-route-line svg{color:rgba(255,255,255,.4)}
.trip-card-hdr .trip-dur{position:absolute;top:50%;left:50%;transform:translate(-50%,-20%);font-family:var(--f-m);font-size:12px;color:rgba(255,255,255,.5);white-space:nowrap;z-index:1}
.trip-card-hdr .trip-times{display:flex;justify-content:space-between;font-family:var(--f-m);margin-top:4px}
.trip-card-hdr .trip-times .tt-time{font-size:15px;color:rgba(255,255,255,.8)}
.trip-card-hdr .trip-times .tt-term{font-size:11.5px;color:rgba(255,255,255,.4);display:block}
.trip-card-hdr .tc-badge{position:absolute;top:18px;right:18px;padding:5px 14px;border-radius:8px;font-size:12.5px;font-weight:700;letter-spacing:.02em}
.trip-card-hdr .tc-badge.red{background:var(--red);color:#fff}
.trip-card-hdr .tc-badge.amber{background:var(--amber-bg);color:#fff}

.trip-card-alert{display:none}

.trip-card-actions{display:flex;gap:10px;padding:0 20px 20px}
.trip-card-actions .btn-outline{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:var(--r-s);font-size:15px;font-weight:700;transition:.2s}
.trip-card-actions .btn-fill{background:linear-gradient(135deg,var(--blue),var(--blue-dk));color:#fff;border:none;box-shadow:0 4px 14px rgba(29,92,169,.2)}
.trip-card-actions .btn-fill:hover{box-shadow:0 6px 20px rgba(29,92,169,.3)}
.trip-card-actions .btn-outline{border:1.5px solid var(--line-2);color:var(--navy);background:var(--surface)}
.trip-card-actions .btn-outline:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-tint)}

.trip-card-body{padding:20px}
.trip-route{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.trip-route-pt{text-align:center}
.trip-route-pt .iata{font-size:26px;font-weight:700;color:var(--navy);letter-spacing:-.02em}
.trip-route-pt .city{font-size:12px;color:var(--ink-2)}
.trip-route-line{flex:1;height:0;border-top:1.5px dashed var(--line-2);position:relative}
.trip-route-line::after{content:"";position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line-2);background:var(--surface)}
.trip-route-line svg{position:absolute;top:-11px;left:50%;transform:translateX(-50%);width:20px;height:20px;color:var(--ink-3)}

.trip-meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink-2)}
.trip-meta b{color:var(--ink);font-weight:600}
.trip-card-foot{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;font-size:13px}
.trip-card-foot .pax-count{color:var(--ink-2)}
.trip-card-foot .pnr{font-family:var(--f-m);font-size:12px;color:var(--navy);background:var(--bg);padding:4px 12px;border-radius:100px}

.trip-card-cta{display:flex;align-items:center;justify-content:center;gap:8px;padding:18px 20px;border-top:1px solid var(--line);font-size:15.5px;font-weight:700;color:var(--blue)}
.trip-card-cta svg{width:16px;height:16px}

/* Journey Hub tiles */
.hub-tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:var(--sp-l)}
.hub-tile{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-1);padding:18px;cursor:pointer;transition:box-shadow .25s,transform .25s var(--ease-out);position:relative}
.hub-tile:hover{box-shadow:var(--sh-2);transform:translateY(-1px)}
.hub-tile-emoji{font-size:28px;margin-bottom:10px;line-height:1;display:block}
.hub-tile b{display:block;font-size:16px;font-weight:700;margin-bottom:4px;color:var(--navy)}
.hub-tile .htile-badge{position:absolute;top:14px;right:14px;width:10px;height:10px;border-radius:50%;background:var(--red)}
.hub-tile .htile-status{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;margin-top:4px}
.hub-tile .htile-status.action{color:var(--red)}
.hub-tile .htile-status.info{color:var(--blue)}
.hub-tile .htile-status.ok{color:var(--green)}
.hub-tile .htile-status.new{color:var(--green)}
.hub-tile .htile-chev{color:var(--ink-3);font-size:18px;font-weight:300;line-height:1}

.trip-notif{margin:0 0 var(--sp-l);padding:16px 20px;border-radius:var(--r);background:var(--blue-tint);border:1px solid rgba(29,92,169,.12);display:flex;align-items:flex-start;gap:12px}
.trip-notif .tn-ic{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--blue);color:var(--blue);display:grid;place-items:center;flex-shrink:0}
.trip-notif .tn-ic svg{width:16px;height:16px}
.trip-notif .tn-bd{flex:1}
.trip-notif .tn-bd b{display:block;font-size:14px;font-weight:700;margin-bottom:2px}
.trip-notif .tn-bd p{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.45}
.trip-notif .tn-time{display:none}

/* ═══ TAB CONTENT — Home / Book / Account ═══ */
.tab-section{padding:var(--sp-l) 0}
.tab-section-hd{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:12px}
.tab-hero{padding:28px 0 8px}
.tab-hero h1{font-size:clamp(24px,3vw,32px);margin-bottom:4px}
.tab-hero p{font-size:15px;color:var(--ink-2);margin:0}

/* Quick actions row */
.qa-row{display:flex;gap:12px;padding:8px 0 var(--sp-l);overflow-x:auto;scrollbar-width:none}
.qa-row::-webkit-scrollbar{display:none}
.qa-btn{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:72px;padding:14px 12px;border-radius:var(--r);background:var(--surface);box-shadow:var(--sh-1);font-size:11.5px;font-weight:600;color:var(--ink-2);text-align:center;flex-shrink:0;transition:box-shadow .2s,transform .2s}
.qa-btn:hover{box-shadow:var(--sh-2);transform:translateY(-1px)}
.qa-btn .qa-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:18px;margin-bottom:2px}
.qa-btn .qa-ic.navy{background:linear-gradient(135deg,var(--navy),#2A3A72);color:#fff}
.qa-btn .qa-ic.blue{background:var(--blue-tint);color:var(--blue)}
.qa-btn .qa-ic.green{background:var(--green-tint);color:var(--green)}
.qa-btn .qa-ic.amber{background:var(--amber-tint);color:var(--amber)}

/* Promo card */
.promo-card{border-radius:var(--r);overflow:hidden;background:linear-gradient(145deg,var(--navy),#2A3A72);color:#fff;padding:28px 24px;margin-bottom:16px;position:relative;box-shadow:var(--sh-2)}
.promo-card h3{font-size:20px;font-weight:700;margin:0 0 6px;letter-spacing:-.01em}
.promo-card p{font-size:14px;opacity:.75;margin:0 0 16px;max-width:70%;line-height:1.5}
.promo-card .promo-tag{position:absolute;top:20px;right:20px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:100px;background:rgba(255,255,255,.15);text-transform:uppercase;letter-spacing:.05em}
.promo-card .btn-promo{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:100px;background:#fff;color:var(--navy);font-size:14px;font-weight:700}

/* Destination card */
.dest-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.dest-card{border-radius:var(--r);overflow:hidden;background:var(--surface);box-shadow:var(--sh-1);cursor:pointer;transition:box-shadow .25s,transform .25s}
.dest-card:hover{box-shadow:var(--sh-2);transform:translateY(-1px)}
.dest-img{height:120px;background-size:cover;background-position:center;position:relative}
.dest-img::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 50%,rgba(0,0,0,.4))}
.dest-img span{position:absolute;bottom:10px;left:12px;color:#fff;font-size:12px;font-weight:700;z-index:1;letter-spacing:.02em}
.dest-body{padding:12px 14px}
.dest-body b{display:block;font-size:15px;font-weight:700;margin-bottom:2px}
.dest-body span{font-size:13px;color:var(--ink-2)}
.dest-body .dest-price{float:right;font-family:var(--f-m);font-size:14px;font-weight:500;color:var(--green)}

/* Search form (Book tab) */
.book-form{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-2);padding:24px;margin-bottom:24px}
.form-row{display:flex;gap:12px;margin-bottom:14px}
.form-field{flex:1;display:flex;flex-direction:column;gap:4px}
.form-field label{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.form-field .fi{display:flex;align-items:center;gap:8px;padding:12px 14px;border:1.5px solid var(--line-2);border-radius:var(--r-s);font-size:15px;font-weight:600;color:var(--navy);background:var(--surface)}
.form-field .fi svg{width:18px;height:18px;color:var(--ink-3);flex-shrink:0}
.form-swap{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;align-self:flex-end;margin-bottom:4px;flex-shrink:0;color:var(--ink-3);transition:.2s}
.form-swap:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-tint)}
.form-swap svg{width:16px;height:16px}
.form-tabs{display:flex;gap:0;margin-bottom:20px;border-radius:var(--r-s);overflow:hidden;border:1.5px solid var(--line-2)}
.form-tab{flex:1;padding:10px;text-align:center;font-size:13px;font-weight:700;color:var(--ink-2);transition:.2s}
.form-tab.active{background:var(--navy);color:#fff}

/* Account profile card */
.profile-card{background:linear-gradient(145deg,var(--navy),#2A3A72);color:#fff;border-radius:var(--r);padding:28px 24px;margin-bottom:20px;box-shadow:var(--sh-2)}
.profile-card .pc-top{display:flex;align-items:center;gap:16px;margin-bottom:20px}
.profile-card .pc-av{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.15);display:grid;place-items:center;font-size:20px;font-weight:700;flex-shrink:0}
.profile-card .pc-name{font-size:20px;font-weight:700;letter-spacing:-.01em}
.profile-card .pc-tier{font-size:13px;opacity:.7;margin-top:2px}
.pc-stats{display:flex;gap:0;border-top:1px solid rgba(255,255,255,.15)}
.pc-stat{flex:1;padding:16px 0 0;text-align:center}
.pc-stat+.pc-stat{border-left:1px solid rgba(255,255,255,.15)}
.pc-stat b{display:block;font-family:var(--f-m);font-size:22px;font-weight:500}
.pc-stat span{display:block;font-size:11.5px;opacity:.6;margin-top:2px}

/* Account menu list */
.acct-menu{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-1);overflow:hidden;margin-bottom:16px}
.acct-item{display:flex;align-items:center;gap:14px;padding:16px 18px;width:100%;transition:background .15s}
.acct-item:hover{background:var(--bg)}
.acct-item+.acct-item{border-top:1px solid var(--line)}
.acct-item .ai-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:16px;flex-shrink:0}
.acct-item .ai-ic.blue{background:var(--blue-tint);color:var(--blue)}
.acct-item .ai-ic.green{background:var(--green-tint);color:var(--green)}
.acct-item .ai-ic.amber{background:var(--amber-tint);color:var(--amber)}
.acct-item .ai-ic.navy{background:rgba(29,39,87,.08);color:var(--navy)}
.acct-item b{flex:1;font-size:15px;font-weight:600}
.acct-item .ai-meta{font-size:13px;color:var(--ink-3);flex-shrink:0}
.acct-item .ai-chev{color:var(--ink-3);flex-shrink:0}
.acct-item .ai-chev svg{width:16px;height:16px}

/* Upcoming flight mini card */
.upcoming-flight{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-1);padding:18px 20px;margin-bottom:16px;display:flex;align-items:center;gap:16px}
.upcoming-flight .uf-left{flex:1}
.upcoming-flight .uf-route{font-family:var(--f-m);font-size:18px;font-weight:500;color:var(--navy);margin-bottom:2px}
.upcoming-flight .uf-meta{font-size:13px;color:var(--ink-2)}
.upcoming-flight .uf-status{padding:5px 12px;border-radius:100px;font-size:12px;font-weight:700;background:var(--red-tint);color:var(--red);flex-shrink:0;display:flex;align-items:center;gap:4px}
.upcoming-flight .uf-status svg{width:12px;height:12px}

.bstep{display:flex;gap:13px;padding-bottom:15px;position:relative}

details{margin-bottom:22px}
summary{list-style:none;cursor:pointer;font-size:15px;font-weight:600;color:var(--blue);display:flex;align-items:center;gap:8px;padding:6px 0}

  .row-ic{width:24px;height:24px;border-radius:6px;font-size:11px}
  .row-bd b{font-size:13px}
  .row-bd p{font-size:12px;-webkit-line-clamp:1;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
  .row-val b{font-size:12.5px}
  .row-val span{font-size:10.5px}
  .rows{border-radius:12px;margin-bottom:10px}

  /* Details — hidden on mobile to save space */
  .screen details{display:none}
  .comp .actions .btn-sm{display:none}

  /* Partners — hidden on mobile */
  .partners{display:none}

  /* Drawer as bottom sheet */
  .drawer{width:100%;top:auto;bottom:0;left:0;right:0;max-height:85vh;border-left:none;border-top:none;border-radius:24px 24px 0 0;transform:translateY(100%);box-shadow:0 -20px 60px -20px rgba(29,39,87,.3)}
  .drawer.open{transform:translateY(0)}

  /* Toasts & FAB */
  .toasts{top:66px;right:12px;left:12px;max-width:none}
  .toast{border-radius:var(--r-s);padding:12px 14px}
  .toast .ic{width:24px;height:24px;border-radius:6px;font-size:12px}
  .toast b{font-size:13px}
  .toast p{font-size:12.5px}
  .help-fab{bottom:20px;right:16px;padding:12px 18px 12px 14px;font-size:13.5px;box-shadow:0 4px 16px rgba(29,39,87,.25)}

  /* ═══ DISCLOSURE — MOBILE ═══ */
  .disc-group{margin-bottom:12px;border-radius:14px}
  .disc-hd{padding:14px}
  .disc-ic{width:32px;height:32px;border-radius:8px;font-size:14px}
  .disc-title b{font-size:14px}
  .disc-title span{font-size:11px}
  .disc-val{font-size:13px}
  .disc-bd-inner{padding:0 14px 12px}
  .disc-bd-inner p{font-size:13px;line-height:1.45}
  .disc-hero{padding:12px 0;margin-bottom:4px}
  .disc-hero .dh-amt{font-size:30px}
  .disc-hero .dh-label{font-size:12px}
  .disc-summary-row{padding:12px 14px}
  .disc-summary-row .row-ic{width:24px;height:24px;border-radius:6px;font-size:11px}
  .disc-summary-row .row-bd b{font-size:13px}
  .disc-summary-row .row-bd p{font-size:11px}
  .disc-summary-row .row-val b{font-size:12px}
  .disc-summary-row .row-val span{font-size:10px}

  /* Mobile accordion: compact options */
  .mob-disc-opt{padding:12px 14px;border-radius:12px}
  .mob-disc-opt .opt-hd h3{font-size:14px;margin-bottom:0;gap:5px}
  .mob-disc-opt .opt-hd p{font-size:12px;margin:0}
  .mob-disc-opt .opt-radio{width:16px;height:16px;margin-top:0}
  .mob-disc-opt.sel .opt-radio::after{width:6px;height:6px}
  .mob-disc-opt .opt-top{gap:8px;align-items:center}
  .mob-disc-opt .opt-detail{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s var(--ease-out);margin-top:0}
  .mob-disc-opt .opt-detail>div{overflow:hidden}
  .mob-disc-opt.sel .opt-detail{grid-template-rows:1fr;margin-top:8px}
}
*{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important}}
</style>
</head>

  WhatsApp:brand("whatsapp","WhatsApp","25D366","bi-sm")};

/* ═══════════ STATE ═══════════ */
let sc,S;
function loadScenario(key){
  if(!SC[key]) return;
  sc=SC[key]; sc.key=key;
  S={key,si:0,option:null,hotel:null,compAccepted:false,altTaken:false,
     prefs:{sms:true,email:true,app:true},msgs:sc.msgs.map(m=>({...m}))};
  $("drLog").innerHTML=""; say(bootLine()); chips(bootChips());
  if($("appAv")) $("appAv").textContent=sc.pax.init;
  if($("sbAv")) $("sbAv").textContent=sc.pax.init;
  if($("sbName")) $("sbName").textContent=sc.pax.name;
  render();
  setTimeout(()=>toast("New message",firstToast()),reduced?0:1200);
}
const stepIds=()=>sc.steps.map(s=>s[0]);
const curStep=()=>sc.steps[S.si][0];

/* ═══════════ PIECES ═══════════ */
function itinHTML(){
  const legs=[...sc.legs];
  if(S.option&&S.option.newLeg) legs.push({...S.option.newLeg,state:"new",tag:"Confirmed"});
  return `<div class="card itin">
    <div class="itin-hd">${ico("plane")}<b>${sc.key==="bag"?"Your flight and your bag":"Your trip"}</b><span class="mono">${sc.pax.pnr}</span></div>
    ${legs.map(l=>`<div class="leg ${l.state}">
      <span class="leg-fl">${esc(l.no)}</span>
      <span class="leg-line">
        <span class="leg-pt"><b>${esc(l.from)}</b><span>${esc(l.dep)} · ${esc(l.date)}</span></span>
        <span class="leg-arc"></span>
        <span class="leg-pt"><b>${esc(l.to)}</b><span>${esc(l.arr)}</span></span>
      </span>
      <span class="leg-tag ${l.state}">${esc(l.tag)}</span>
    </div>`).join("")}
    <div class="itin-ft">
      <span>${sc.pax.party>1?`Party of <b>${sc.pax.party}</b>`:`Passenger <b>${esc(sc.pax.name)}</b>`}</span>
      <span>Cabin <b>${esc(S.option&&S.option.cabin?S.option.cabin:sc.pax.cabin)}</b></span>
      ${S.option&&S.option.seat?`<span>Seat <b>${esc(S.option.seat)}</b></span>`:""}
      <span>Bag <b class="mono">${sc.pax.bag}</b></span>
    </div></div>`;
}

function noticeHTML(){
  return `<div class="notice"><span class="ic">${ico("check")}</span><div>
    <b>We've already let you know</b>
    <p>Sent the moment this was confirmed, to every channel you've asked for.</p>
    <div class="chans">
      <span class="chan">${ico("message-square")}Text to ${sc.pax.phone}</span>
      <span class="chan">${ico("mail")}Email</span>
      <span class="chan">${ico("smartphone")}In the app</span>
      ${S.msgs.some(m=>m.kind==="WhatsApp")?`<span class="chan">${brand("whatsapp","WhatsApp","25D366","bi-sm")}WhatsApp</span>`:""}
    </div></div></div>`;
}

function optionsHTML(cfg){
  return `<div class="opts">${cfg.options.map(o=>{
    const sel=S.option&&S.option.id===o.id;
    const leg=o.newLeg;
    return `<button class="opt ${sel?"sel":""}" data-opt="${o.id}">
      <span class="opt-top"><span class="opt-radio"></span><span class="opt-hd">
        <h3>${o.rec?`<span class="rec">Recommended</span>`:""}${esc(o.title)}</h3>
        <p>${esc(o.sub)}</p></span></span>
      ${leg?`<span class="opt-flight-card">
        <span class="ofc-route"><b>${esc(leg.no)}</b> · ${esc(leg.from)} → ${esc(leg.to)}</span>
        <span class="ofc-times"><span class="ofc-time">${esc(leg.dep)}</span><span class="ofc-dur">${ico("plane")}</span><span class="ofc-time">${esc(leg.arr)}</span></span>
        <span class="ofc-meta">${esc(leg.date)}${o.cabin?" · "+esc(o.cabin):""}${o.seat?" · Seat "+esc(o.seat):""}</span>
      </span>`:""}
      <span class="opt-facts">${o.facts.map(([k,v,g])=>`<span class="f"><em>${esc(k)}</em><b class="${g?"good":""}">${v}</b></span>`).join("")}</span>
      ${sel?`<span class="opt-incl"><span class="ttl">What's included</span>
        <span class="incl-list">${o.incl.map(i=>`<span class="incl"><span class="tk">${ico("check")}</span><span>${i}</span></span>`).join("")}</span></span>`:""}
    </button>`;
  }).join("")}</div>`;
}

/* ═══════════ SCREENS ═══════════ */
function scAlert(){
  const breadcrumb=`${sc.legs[0].no} · ${sc.legs[0].from} → ${sc.legs[sc.legs.length-1].to}`;
  const mob=isMob();
  return `<div class="screen">
    <div class="hub-breadcrumb"><span class="mono">${esc(breadcrumb)}</span></div>
    <div class="status">
      <div class="status-band ${sc.sev==="amber"?"amber":""}">${ico(sc.sev==="amber"?"triangle-alert":"circle-x")}

      <div class="status-body">${mob?`<p>${sc.alert.paras[0]}</p>`:sc.alert.paras.map(p=>`<p>${p}</p>`).join("")}</div>

    ${mob?"":itinHTML()+'<div style="height:16px"></div>'}

      <button class="btn btn-3" data-help="rights">What am I entitled to?</button>

}

}

function bagStates(){
  const o=S.option;
  if(sc.key==="bag"){
    const base=[["done","Checked in at Johannesburg","Yesterday 18:40"],["done","Missed the transfer container","06:02 today"],
                ["done","Held in the JNB baggage store","Secure, tagged to you"],["now","Loading onto BA0058","Tonight 19:45"]];
    if(!o) return [...base,["pending","Choose how to get it back","—"]];
    if(o.id==="collect") return [...base,["pending","Lands Heathrow T5","06:15 tomorrow"],["pending","On the T5 service desk","From 07:30"]];
    return [...base,["pending","Lands Heathrow T5","06:15 tomorrow"],["pending",`Courier to ${o.id==="office"?"Canary Wharf":"Clerkenwell"}`,o.facts[0][1]]];
  }
  if(sc.key==="misconnect"){
    const b=[["done","Four bags checked at SFO","Yesterday 18:12"],["done","Unloaded at Heathrow","17:41 today"]];
    if(!o) return [...b,["now","Waiting on your onward choice","—"]];
    return o.needsHotel
      ? [...b,["now","Held overnight in the T5 store","Secure, tagged to you"],["pending","Loaded onto BA0430","06:00 tomorrow"],["pending","Arrives Amsterdam","09:30 tomorrow"]]
      : [...b,["now","Moving to your new flight","Now"],["pending",`Loaded onto ${o.newLeg.no}`,`${o.newLeg.dep} tonight`],["pending","Arrives Amsterdam",o.newLeg.arr]];
  }
  if(sc.key==="downgrade"){
    return o&&o.newLeg
      ? [["done","Checked in at Schiphol","16:20 today"],["now","Held overnight at AMS","Tagged to you"],["pending","Loaded onto BA0430","07:40 tomorrow"],["pending","Arrives Heathrow","08:35 tomorrow"]]
      : [["done","Checked in at Schiphol","16:20 today"],["now","Loaded onto BA0432","17:35"],["pending","Arrives Heathrow T5","18:20 tonight"],["pending","On belt 4","About 18:40"]];
  }
  if(!o) return [["done","Checked in at Heathrow T5","Today 12:04"],["now","Held in the T5 baggage store","Now"],["pending","Waiting on your choice","—"]];
  if(o.id==="refund") return [["done","Checked in at Heathrow T5","Today 12:04"],["done","Pulled from the aircraft","14:31"],["now","On its way to arrivals belt 5","About 20 minutes"],["pending","Ready to collect","—"]];
  if(o.needsHotel) return [["done","Checked in at Heathrow T5","Today 12:04"],["done","Pulled from the aircraft","14:31"],["now","Held overnight in the T5 store","Secure, tagged to you"],["pending","Loaded onto BA0113","Tomorrow 07:15"],["pending","Arrives New York JFK","Tomorrow 11:55"]];
  return [["done","Checked in at Heathrow T5","Today 12:04"],["done","Re-tagged for tonight's route","14:38"],["now","Loading onto BA0213","20:45"],["pending","Transferred at Boston","We do this for you"],["pending","Arrives New York JFK","Tomorrow 07:10"]];
}

/* ═══════════ RENDER ═══════════ */
function renderProgress(){
  const skip=stepIds().includes("hotel")&&S.option&&!S.option.needsHotel;
  const vis=sc.steps.filter(s=>!(s[0]==="hotel"&&skip));
  $("pSteps").innerHTML=vis.map(s=>{
    const i=sc.steps.indexOf(s),cls=i<S.si?"done":i===S.si?"now":"";
    return `<button class="pstep ${cls}" data-si="${i}" ${i<S.si?"":"disabled"}>
      <span class="n">${i<S.si?ico("check"):i+1}</span>${esc(s[1])}</button>`;
  }).join("");
  $("pFill").style.width=((S.si+1)/sc.steps.length*100)+"%";
  $("pSteps").querySelectorAll("[data-si]").forEach(b=>{if(!b.disabled)b.onclick=()=>{S.si=+b.dataset.si;render();};});
}
function icons(){ if(window.lucide) lucide.createIcons(); }

function render(){
  $("hdrPnr").textContent=sc.pax.pnr;
  $("hdrWho").textContent=sc.pax.init;
  $("ftrRef").textContent=`Booking ${sc.pax.pnr} · UK261 rules applied`;
  $("demoPills").innerHTML=Object.entries(SC).map(([k,v])=>
    `<button class="dp ${k===S.key?"on":""}" data-sc="${k}">${ico(v.icon)}${esc(v.label)}</button>`).join("");
  $("demoPills").querySelectorAll("[data-sc]").forEach(b=>b.onclick=()=>loadScenario(b.dataset.sc));
  renderProgress();
  const mainEl=$("main");
  mainEl.innerHTML=SCREEN[curStep()]();
  renderRail(); icons(); bind();
  const scrn=mainEl.querySelector(".screen");
  if(scrn) scrn.scrollTop=0;
  window.scrollTo({top:0,behavior:reduced?"auto":"smooth"});
}

function advance(){
  let n=S.si+1;
  if(stepIds()[n]==="hotel"&&S.option&&!S.option.needsHotel) n++;
  S.si=Math.min(n,sc.steps.length-1);
}

function bind(){
  const m=$("main");
  m.querySelectorAll("[data-adv]").forEach(b=>b.onclick=()=>{advance();render();});
  m.querySelectorAll("[data-goto]").forEach(b=>b.onclick=()=>{const i=stepIds().indexOf(b.dataset.goto);if(i>=0){S.si=i;render();}});
  m.querySelectorAll("[data-help]").forEach(b=>b.onclick=()=>{openDrawer();ask(HELP_Q[b.dataset.help]);});
  m.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>{
    const pool=curStep()==="care"?sc.extraChoice.options:sc.choose.options;
    S.option=pool.find(o=>o.id===b.dataset.opt);
    if(!S.option.needsHotel) S.hotel=null;
    render();
  });
  const co=$("confirmOpt"); if(co) co.onclick=confirmOption;
  m.querySelectorAll("[data-hotel]").forEach(b=>b.onclick=()=>{S.hotel=HOTELS.find(h=>h.id===b.dataset.hotel);render();});
  const ch=$("confirmHotel"); if(ch) ch.onclick=confirmHotel;
  const ac=$("acceptComp"); if(ac) ac.onclick=()=>acceptComp(false);
  const al=$("altComp"); if(al) al.onclick=()=>acceptComp(true);

  m.querySelectorAll("[data-disc] .disc-hd").forEach(hd=>{
    hd.onclick=e=>{
      e.stopPropagation();
      const disc=hd.closest("[data-disc]");
      const group=disc.parentElement;
      const wasOpen=disc.classList.contains("open");
      group.querySelectorAll(".disc").forEach(d=>d.classList.remove("open"));
      if(!wasOpen) disc.classList.add("open");
    };
  });
}

/* ═══════════ ACTIONS ═══════════ */
function notify(kind,body,tt,tb){S.msgs.push({kind,t:now(),body});renderRail();icons();if(tt)toast(tt,tb);}

function confirmOption(){
  const o=S.option;
  if(sc.key==="cancel"){
    if(o.id==="refund") notify("SMS",`Your trip is cancelled and <b>£2,340</b> is on its way back to your card. Your bag is coming to arrivals belt 5 at T5.`,"Refund confirmed","Your bag is on its way to belt 5.");
    else if(o.needsHotel) notify("SMS",`Booked: <b>${o.newLeg.no}</b> at ${o.newLeg.dep} tomorrow, seat ${o.seat}, same cabin. Now pick your hotel for tonight — we're paying.`,"Flight rebooked",`${o.newLeg.no} at ${o.newLeg.dep} tomorrow. Seat ${o.seat} held.`);
    else notify("SMS",`Booked: <b>${o.newLeg.no}</b> tonight at ${o.newLeg.dep}, arriving New York ${o.newLeg.arr}. Lounge is open to you now.`,"Flight rebooked",`${o.newLeg.no} tonight. Lounge access added.`);
  }
  if(sc.key==="misconnect") notify("App",`Confirmed: <b>${o.newLeg.no}</b> at ${o.newLeg.dep}, ${o.cabin}, seats ${o.seat}. All four boarding passes are in your wallet. Bags are already moving.`,"Seats confirmed",`${o.newLeg.no} · ${o.cabin} · 4 together.`);
  if(sc.key==="bag") notify("WhatsApp",`Delivery booked: <b>${o.title.toLowerCase()}</b>, ${o.facts[0][1]}. We'll text you when the driver is 20 minutes away.`,"Delivery booked",`${o.facts[0][0]}: ${o.facts[0][1]}.`);
  advance(); render();
}

function confirmHotel(){
  const two=sc.key==="misconnect";
  notify("Email",`Hotel confirmed: <b>${S.hotel.name}</b> tonight, ${two?"two family rooms, ":""}breakfast included, paid by us.${S.hotel.id==="sofitel"?" A four-minute covered walk from T5.":" Shuttle from the T5 coach station."}`,"Hotel booked",`${S.hotel.name} · tonight · paid by BA.`);
  advance(); render();
}

function acceptComp(alt){
  S.compAccepted=true;S.altTaken=alt;
  const c=sc.comp;
  if(alt) notify("Email",c.alt.note.replace(/(\d[\d,]*)/,"<b>$1</b>"),"Avios added",c.alt.note);
  else if(sc.key==="bag") notify("SMS",`Your <b>£170</b> essentials allowance is confirmed on the card ending 2317. Spend it wherever you like — no receipts.`,"Confirmed","£170 is on your card now.");
  else notify("Email",`Your <b>${money(c.amount)}</b> is approved and refunding to the card on your booking. Nothing more to do.`,"Accepted",`${money(c.amount)} back within 2 working days.`);
  render();
}

function toast(t,b){
  const el=document.createElement("div");el.className="toast";
  el.innerHTML=`<span class="ic">${ico("bell")}</span><div><b>${esc(t)}</b><p>${esc(b)}</p></div>`;
  $("toasts").appendChild(el);icons();
  setTimeout(()=>{el.classList.add("out");setTimeout(()=>el.remove(),320);},4600);
}

const HELP_Q={rights:"What am I entitled to?",which:"Which option should I pick?",ownhotel:"Can I arrange my own hotel?",bag:"Where is my bag?",seat:"Can I change my seat?"};
function openDrawer(){$("drawer").classList.add("open");$("scrim").classList.add("on");$("fab").classList.add("hide");}
function closeDrawer(){$("drawer").classList.remove("open");$("scrim").classList.remove("on");$("fab").classList.remove("hide");}

addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer();});
function say(h){const e=document.createElement("div");e.className="m ai";e.innerHTML=`<div class="m-b">${h}</div>`;$("drLog").appendChild(e);$("drLog").scrollTop=1e6;icons();return true;}
function me(t){const e=document.createElement("div");e.className="m me";e.innerHTML=`<div class="m-b">${esc(t)}</div>`;$("drLog").appendChild(e);$("drLog").scrollTop=1e6;}
function thinking(){const e=document.createElement("div");e.className="m ai";e.id="tp";e.innerHTML=`<div class="m-b" style="padding:0;background:none;border:none"><div class="typing"><i></i><i></i><i></i></div></div>`;$("drLog").appendChild(e);$("drLog").scrollTop=1e6;}
function chips(l){$("drChips").innerHTML=l.map(c=>`<button class="dchip">${esc(c)}</button>`).join("");$("drChips").querySelectorAll(".dchip").forEach(b=>b.onclick=()=>ask(b.textContent));}
function ask(t){if(!t||!t.trim())return;me(t);$("drIn").value="";autosize();thinking();setTimeout(()=>{const x=$("tp");if(x)x.remove();answer(t.toLowerCase());},reduced?60:760);}

function bootLine(){
  const w={cancel:"BA0117 cancellation",misconnect:"missed Amsterdam connection",bag:"delayed bag",downgrade:"Club Europe downgrade"}[S.key];
  return `Hello ${esc(sc.pax.first)}. I can see your ${w} and everything we've arranged for it. Ask me anything — I won't put you in a queue.`;
}
function bootChips(){return {
  cancel:["Which option should I pick?","What am I entitled to?","Where is my bag?"],
  misconnect:["Which option should I pick?","Why only £260?","Will our bags make it?"],
  bag:["Where is my bag?","What if it's never found?","Can I spend the £170 anywhere?"],
  downgrade:["Why only 30%?","Should I take the Avios?","Can I fly in Club tomorrow?"]}[S.key];}
function firstToast(){return {cancel:"We've texted and emailed you your options for BA0117.",
  misconnect:"We've held four seats on the next Amsterdam flight.",
  bag:"Don't wait at the belt — we've already raised your bag file.",
  downgrade:"£186 reimbursement and £94 of refunds are waiting."}[S.key];}

function answer(q){
  const o=S.option,c=sc.comp;

  if(/entitl|right|owed|law|261|montreal/.test(q)){
    if(S.key==="bag") return say(`Bags aren't covered by UK261 — they fall under the <b>Montreal Convention</b>:<ul><li><b>£170 now</b> for essentials, no receipts, already on your card.</li><li>Reimbursement of reasonable extra costs, up to <b>£1,300</b> in total.</li><li>If the bag isn't found within <b>21 days</b>, it's declared lost and a full claim opens by itself.</li></ul>`)&&chips(["What if it's never found?","Where is my bag?"]);
    if(S.key==="downgrade") return say(`Involuntary downgrade is <b>Article 10(2)</b> of UK261. Under 1,500 km it's a fixed <b>30% of the segment fare</b> — £186 here. Separately you get back the ancillaries you paid for and won't now use: lounge pass and seat 2A, <b>£94</b>. Neither is discretionary and neither needs a claim form.`)&&chips(["Why only 30%?","Should I take the Avios?"]);
    return say(`Because the cause was ours, three things are owed to you — none of which you have to claim:<ul><li><b>${money(c.amount)} compensation</b> under UK261. Already approved.</li><li><b>A replacement flight</b> in the same cabin at no extra cost — or a full refund.</li><li><b>Hotel, meals and transport</b> if you wait overnight. We book and pay directly.</li></ul>Weather or air traffic control would remove the cash, but never the flight or the hotel.`)&&chips(["Which option should I pick?","Where is my bag?"]);
  }

  if(/why only|reduc|halv|\b50\b|\b30\b|260|186/.test(q)){
    if(S.key==="misconnect") return say(`Article 7(2) lets us halve compensation when we get you there <b>under four hours</b> later than booked. Your arrival delay is <b>3 hours 12 minutes</b>, so £520 becomes £260 — each, so <b>£1,040</b> for the four of you. Had it tipped past four hours it would be the full amount, and I'd have told you that too.`);
    if(S.key==="downgrade") return say(`30% is the band UK261 sets for journeys under 1,500 km. Amsterdam to London is 371 km. Longer routes attract 50% or 75% — this one doesn't, and we can't top it up in cash. What we <i>can</i> do is offer <b>22,000 Avios</b>, worth roughly £242 for you.`)&&chips(["Should I take the Avios?"]);
  }

  if(/avios|points|worth more/.test(q))
    return say(`For a Gold member redeeming on premium cabins, Avios usually beat the cash. ${S.key==="downgrade"?"22,000 Avios is worth about <b>£242</b> against <b>£186</b> cash — so yes, if you'll use them within a couple of years.":"The Avios option here is worth slightly more than the cash if you redeem on premium cabins."} Cash is safer if you'd rather have the money now. Either way it's one tap.`);

  if(/which|recommend|should i|best|advice/.test(q)){
    const rec=(S.key==="downgrade"?sc.extraChoice:sc.choose).options.find(x=>x.rec);
    return say(`I'd take <b>${esc(rec.title.toLowerCase())}</b>. ${{
      cancel:"It's the only option that keeps you in Club World the whole way on a direct flight, and the hotel, dinner, breakfast and transfers cost you nothing. Take the one-stop tonight only if landing in the morning genuinely matters.",
      misconnect:"It gets all four of you to Amsterdam tonight with seats together, and two hours in the lounge with showers and hot food beats most waits. The 22:10 Club Europe flight is tempting, but landing after midnight with two children rarely is.",
      bag:"Home delivery means you never come back to Heathrow, and you get a text when the driver is twenty minutes out. Choose the office if nobody will be in during the morning.",
      downgrade:"Flying tonight and taking the money is usually right — you still get home this evening and £280 comes back. Pick tomorrow's Club flight only if the cabin mattered more than the timing."
    }[S.key]}`)&&chips(["What am I entitled to?"]);
  }

  if(/bag|luggage|suitcase|where is/.test(q)){
    const st=bagStates().find(s=>s[0]==="now");
    return say(`${sc.pax.party>1?"Four bags":`Bag <b>${sc.pax.bag}</b>`} — ${st?st[1].toLowerCase():"in our care"}. ${{
      cancel:o?(o.needsHotel?"It stays with us tonight and goes onto tomorrow's flight automatically. Nothing to collect, nothing to re-check.":o.id==="refund"?"It's coming to arrivals belt 5 at T5 for you.":"Checked through to New York — we handle the Boston transfer."):"Once you've chosen an option we'll route it to match.",
      misconnect:o?(o.needsHotel?"Held overnight and loaded onto the morning flight.":"Being moved to your new flight now. Skip the transfer desk entirely."):"All four are held ready for whichever onward flight you pick.",
      bag:"It's on tonight's BA0058 and lands at 06:15 tomorrow. Every scan appears in the panel on this page, live.",
      downgrade:"On the aircraft and arriving with you at 18:20."}[S.key]}`)&&chips(bootChips());
  }

  if(/never found|lost|21 day|claim/.test(q)&&S.key==="bag")
    return say(`After <b>21 days</b> a delayed bag is formally declared lost, and a full claim opens automatically — you don't start it or chase it. You'd be covered up to <b>£1,300</b> under the Montreal Convention, and the <b>£170</b> you've already had comes off that, not on top. Fewer than 3 in 1,000 delayed bags reach 21 days.`);

  if(/spend|anywhere|receipt|voucher|money/.test(q))
    return say(`It goes onto the card on your booking — no paper vouchers, no receipts, no queue at a desk. ${S.key==="bag"?"Spend the <b>£170</b> on toiletries and clothes wherever you like.":"Spend it in the terminal or at the hotel."} If you spend more than the allowance and it's reasonable, send the receipts afterwards and we'll top it up.`);

  if(/own hotel|my own|friend|family|arrange/.test(q))
    return say(`Yes. Pick <b>“I'd rather arrange my own”</b> and we'll reimburse up to <b>£180</b> per room for the night plus reasonable travel. Keep the receipts for that one — it's the only part where we need them. The meal allowance is yours either way.`);

  if(/seat|window|aisle/.test(q))
    return say(`${o&&o.seat?`You're in <b>${o.seat}</b>, the closest equivalent to what you booked. `:""}You can change it free from your booking up to 24 hours before departure — you'd paid for seat selection on the original flight, so that carries across.`);

  if(/club tomorrow|upgrade|cabin/.test(q)&&S.key==="downgrade")
    return say(`Yes — tomorrow's <b>BA0430 at 08:20</b> has Club Europe open and seat 2A held for you. We'd cover a hotel in Amsterdam tonight plus dinner and breakfast, and you'd still keep the <b>£186</b>, because the downgrade happened either way. It's the second option on this page.`);

  if(/bags make it|will our bags|transfer/.test(q)&&S.key==="misconnect")
    return say(`All four are already tagged for whichever flight you choose — we started moving them while you were still taxiing. You don't need the transfer desk or to re-check anything. The panel on this page shows each scan as it happens.`);

  if(/call|phone|speak|human|agent/.test(q))
    return say(`You can — <b>0344 493 0787</b>, and Gold members go to the front of the queue. But everything on this page is already done or one tap away, so a call would mostly repeat it. If something here isn't working, tell me what and I'll fix it rather than send you to a queue.`);

  if(/why|cause|what happened/.test(q))
    return say({cancel:`A technical fault with the aircraft. Engineering couldn't release it before the New York curfew and there was no spare at Heathrow. Because it was our aircraft and our fault, it's within our control — which is exactly why the £520 is owed.`,
      misconnect:`San Francisco departed 2 hours 48 minutes late after a knock-on delay from the inbound aircraft, and we lost more time in the air. Within our control, so compensation applies — reduced, because you'll still land under four hours late.`,
      bag:`Your bag was in a transfer container that reached the aircraft after loading closed in Johannesburg. It never left the airport, which is why we could confirm it onto tonight's flight rather than start a search.`,
      downgrade:`We substituted the aircraft at short notice and the replacement has three fewer Club Europe rows. Nine people were moved, chosen by check-in order rather than status — you were among the last to check in.`}[S.key]);

  say(`I can help with your ${{cancel:"flight options, the hotel, meals, your bag or the £520",misconnect:"onward flight, the lounge, your bags or the £260",bag:"bag, the delivery, the £170 or what happens if it's lost",downgrade:"£186, the ancillary refunds or flying in Club tomorrow"}[S.key]}. What would be most useful?`);
  chips(bootChips());
}

function enterHub(){
  const shell=$("appShell"),body=$("appBody"),hub=$("hubShell");
  shell.classList.add("in-hub");
  if($("mobPnr")) $("mobPnr").textContent=sc.pax.pnr;
  if(reduced){
    body.style.display="none";
    hub.classList.add("active");
    window.scrollTo({top:0,behavior:"auto"});
    return;
  }
  body.classList.add("view-exit");
  body.addEventListener("animationend",function h(){
    body.removeEventListener("animationend",h);
    body.style.display="none";
    body.classList.remove("view-exit");
    hub.classList.add("active","view-enter");
    window.scrollTo({top:0,behavior:"auto"});
    hub.addEventListener("animationend",function h2(){
      hub.removeEventListener("animationend",h2);
      hub.classList.remove("view-enter");
    });
  });
}

function exitHub(){
  const shell=$("appShell"),body=$("appBody"),hub=$("hubShell");
  if(reduced){
    hub.classList.remove("active");
    shell.classList.remove("in-hub");
    body.style.display="";
    renderAppBody("trips");
    window.scrollTo({top:0,behavior:"auto"});
    return;
  }
  hub.classList.add("view-exit");
  hub.addEventListener("animationend",function h(){
    hub.removeEventListener("animationend",h);
    hub.classList.remove("active","view-exit");
    shell.classList.remove("in-hub");
    body.style.display="";
    body.classList.add("view-enter");
    renderAppBody("trips");
    window.scrollTo({top:0,behavior:"auto"});
    body.addEventListener("animationend",function h2(){
      body.removeEventListener("animationend",h2);
      body.classList.remove("view-enter");
    });
  });
}
